name: Build and Auto-Release POS & Mobile

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 🪟 1. BUILD WINDOWS DESKTOP APP (.EXE)
  build-windows:
    runs-on: windows-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install dependencies
        run: npm install

      - name: 🚀 Build and Publish Electron App (.exe)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build -- --publish always

  # 🤖 2. BUILD ANDROID APK & ATTACH TO SAME RELEASE
  build-android:
    needs: build-windows
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ☕ Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Prepare Mobile Assets & Install Dependencies
        run: |
          npm install
          npm run build-vendor
          mkdir -p dist-mobile
          cp index.html dist-mobile/
          cp customer-display.html dist-mobile/ 2>/dev/null || true
          cp *.js dist-mobile/ 2>/dev/null || true
          cp -r vendor dist-mobile/
          VERSION=$(node -p "require('./package.json').version")
          sed -i "s/const CURRENT_MOBILE_VERSION = .*/const CURRENT_MOBILE_VERSION = \"$VERSION\";/g" dist-mobile/app.js
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest @capacitor/filesystem@latest @capacitor/share@latest

      - name: 🤖 Initialize Android Project & Sync
        run: |
          npx cap add android || true
          npx cap sync android

          # 🛡️ 1. Android SDK Versions ගැළපීම (Capacitor 6/7 සඳහා API 34+ අනිවාර්යයි)
          if [ -f "android/variables.gradle" ]; then
            sed -i 's/minSdkVersion = .*/minSdkVersion = 24/g' android/variables.gradle
            sed -i 's/compileSdkVersion = .*/compileSdkVersion = 34/g' android/variables.gradle
            sed -i 's/targetSdkVersion = .*/targetSdkVersion = 34/g' android/variables.gradle
          fi

          # 🛡️ 2. AndroidManifest.xml හි Manifest Merger ගැටුම් සහ exported=true ස්වයංක්‍රීයව විසඳීම
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            sed -i 's/<manifest /<manifest xmlns:tools="http:\/\/schemas.android.com\/tools" /g' android/app/src/main/AndroidManifest.xml
            sed -i 's/<application /<application tools:replace="android:allowBackup" /g' android/app/src/main/AndroidManifest.xml
            sed -i 's/<activity/<activity android:exported="true"/g' android/app/src/main/AndroidManifest.xml
            # අතිරික්ත tags ඉවත් කිරීම (Clean-up duplicates)
            sed -i 's/xmlns:tools="http:\/\/schemas.android.com\/tools" xmlns:tools="http:\/\/schemas.android.com\/tools"/xmlns:tools="http:\/\/schemas.android.com\/tools"/g' android/app/src/main/AndroidManifest.xml
            sed -i 's/tools:replace="android:allowBackup" tools:replace="android:allowBackup"/tools:replace="android:allowBackup"/g' android/app/src/main/AndroidManifest.xml
            sed -i 's/android:exported="true" android:exported="true"/android:exported="true"/g' android/app/src/main/AndroidManifest.xml
          fi

      - name: ⚙️ Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace || {
            echo "❌ Build failed! Printing Manifest Merger report below:"
            cat app/build/outputs/logs/manifest-merger-debug-report.txt 2>/dev/null || true
            exit 1
          }

      - name: 🏷️ Get Version from package.json & Prepare APK
        id: prep_apk
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          cp android/app/build/outputs/apk/debug/app-debug.apk "Restaurant-ERP-POS-${VERSION}.apk"

      - name: 🚀 Upload Android APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Restaurant-ERP-Android-APK
          path: "Restaurant-ERP-POS-${{ env.APP_VERSION }}.apk"

      - name: 🌟 Attach APK to Release & Auto-Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Uploading APK to release v${{ env.APP_VERSION }}..."
          gh release upload "v${{ env.APP_VERSION }}" "Restaurant-ERP-POS-${{ env.APP_VERSION }}.apk" --clobber
          echo "Publishing release..."
          gh release edit "v${{ env.APP_VERSION }}" --draft=false --latest
