name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ☕ Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Prepare Mobile Assets & Install Dependencies
        run: |
          npm install
          npm run build-vendor
          mkdir -p dist-mobile
          cp index.html dist-mobile/
          cp customer-display.html dist-mobile/ 2>/dev/null || true
          cp *.js dist-mobile/ 2>/dev/null || true
          cp -r vendor dist-mobile/
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

      - name: 🤖 Initialize Android Project & Sync
        run: |
          npx cap add android
          npx cap sync android

      - name: ⚙️ Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 🚀 Upload Android APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Restaurant-ERP-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
